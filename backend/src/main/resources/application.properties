spring.application.name=family-finance

# ---- 数据源（本地 MySQL 8，库由 sql/init.sql 创建） ----
spring.datasource.url=jdbc:mysql://localhost:3306/family_finance?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

# ---- MyBatis-Plus ----
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ---- Sa-Token ----
sa-token.token-name=Authorization
sa-token.timeout=86400
sa-token.is-concurrent=false
sa-token.is-share=false
sa-token.token-style=uuid

# ---- 服务端口 ----
server.port=8080
